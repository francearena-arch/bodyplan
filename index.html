<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BodyPlan">
<meta name="theme-color" content="#080808">
<title>BodyPlan</title>
<link rel="manifest" href="manifest.json?v=200b5">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=200b5">
<link rel="stylesheet" href="app.css?v=200b5">
</head>
<body>
<header class="topbar">
  <div class="header-spacer" aria-hidden="true"></div>
  <button class="brand brand-home" id="brandHome" aria-label="Zum Dashboard">BODY<span>PLAN</span></button>
  <button class="icon-btn" id="menuBtn" aria-label="Menü öffnen"><span></span><span></span><span></span></button>
</header>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="brand small">BODY<span>PLAN</span></div>
    <button class="icon-close" id="closeDrawer" aria-label="Menü schließen">×</button>
  </div>
  <nav class="drawer-nav">
    <button data-page="dashboard">Dashboard</button>
    <button data-page="plans">Trainingspläne</button>
    <button data-page="library">Übungsbibliothek</button>
    <button data-page="history">Historie</button>
    <button data-page="progress">Fortschritt</button>
    <button data-page="heatmap">Muskel-Heatmap</button>
    <div class="drawer-sep"></div>
    <button data-page="settings">Einstellungen</button>
  </nav>
  <div class="drawer-bottom">
    <button class="drawer-action" id="backupBtn">Daten sichern</button>
    <button class="drawer-action" id="importBtn">Backup importieren</button>
  </div>
</aside>

<main id="app" class="app-shell"></main>

<div class="session-overlay" id="sessionOverlay">
  <section class="session-sheet">
    <div class="session-sticky">
      <div class="session-head">
        <div>
          <div class="eyebrow" id="sessionPlanLabel">Training</div>
          <div class="session-title" id="sessionTitle">Einheit</div>
        </div>
        <button class="icon-close" id="closeSession" aria-label="Training schließen">×</button>
      </div>
      <div class="session-progress"><span id="sessionProgressBar"></span></div>
      <div class="session-metrics">
        <div><span>Training</span><strong id="elapsed">00:00</strong></div>
        <div><span>Pause</span><strong id="restTimer">00:00</strong></div>
      </div>
      <div class="rest-actions">
        <button data-rest="60">60s</button><button data-rest="90">90s</button><button data-rest="120">120s</button><button data-rest="180">180s</button>
      </div>
    </div>
    <div id="sessionContent"></div>
    <button class="primary full" id="finishSession">Training speichern</button>
    <button class="secondary full danger" id="abortSession">Training verwerfen</button>
  </section>
</div>

<div class="dialog-backdrop" id="bodyDialog" hidden><section class="body-dialog" role="dialog" aria-modal="true" aria-labelledby="bodyDialogTitle"><div class="row"><div><div class="eyebrow">Körperdaten</div><h2 id="bodyDialogTitle">Messung erfassen</h2></div><button class="icon-close" id="closeBodyDialog" aria-label="Schließen">×</button></div><form id="bodyForm"><div class="form-field"><label for="bodyDate">Datum</label><input id="bodyDate" type="date" required></div><div class="grid2"><div class="form-field"><label for="bodyWeight">Gewicht (kg)</label><input id="bodyWeight" type="number" inputmode="decimal" min="20" max="500" step="0.1" placeholder="z. B. 72,5"></div><div class="form-field"><label for="bodyFat">Körperfett (%)</label><input id="bodyFat" type="number" inputmode="decimal" min="1" max="70" step="0.1" placeholder="z. B. 12,0"></div></div><p class="muted">Mindestens einen Wert eingeben. Leere Felder verändern bestehende Messwerte nicht.</p><button class="primary full" type="submit">Messung speichern</button></form></section></div>
<input id="importFile" type="file" accept=".json" hidden>
<script src="app.js?v=200b5"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./service-worker.js?v=200b5").catch(()=>{})}</script></body>
</html>
